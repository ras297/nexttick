allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'application'

    group = 'ir.maleki.side-projects'
    version = '0.0.1-SNAPSHOT'
    description = 'The backend project for NextTick, the timeslot reservation app'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    subprojects {
        tasks.withType(Test).configureEach {
            useJUnitPlatform {
                excludeTags 'e2e'
            }
        }

        tasks.register('e2eTest', Test) {
            useJUnitPlatform {
                includeTags 'e2e'
            }
            shouldRunAfter test
        }
    }
}