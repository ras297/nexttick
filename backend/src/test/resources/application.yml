spring:
  application:
    name: nexttick
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/testdb
    username: postgres
    password: admin
  flyway:
    locations: classpath:migration

flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration
