spring:
  application:
    name: nexttick
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 10s
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/testdb
    username:
    password:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration
