services:
    postgres:
        image: postgres:16
        container_name: postgres
        env_file:
            - app.env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        restart: unless-stopped

    app:
        build: .
        container_name: NextTick-app
        depends_on:
            - postgres
            - redis
        ports:
            - "8080:8080"
        env_file:
            - app.env
        command: ["./wait-for-it.sh", "postgres:5432", "--", "java", "-jar", "app.jar"]
        restart: unless-stopped

volumes:
    postgres_data:
