services:
    postgres:
        image: postgres:16
        container_name: postgres
        env_file:
            - app.env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 4G
                reservations:
                    cpus: '2'
                    memory: 4G

    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 2G
                reservations:
                    cpus: '1'
                    memory: 2G

    app:
        build: .
        container_name: NextTick-app
        ulimits:
            nofile:
                soft: 100000
                hard: 100000
        depends_on:
            - postgres
            - redis
        ports:
            - "8080:8080"
        env_file:
            - app.env
        command: ["./wait-for-it.sh", "postgres:5432", "--", "java", "-Xms6G", "-Xmx6G", "-jar", "app.jar"]
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '4'
                    memory: 6G
                reservations:
                    cpus: '4'
                    memory: 6G

volumes:
    postgres_data:
